[project]
name = "dossier"
version = "0.0.1"
description = "Reads SEC filings with LLM agents and produces cited value-investing dossiers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.scripts]
dossier = "dossier.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: test requires live network access to sec.gov (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# PTH enforces CLAUDE.md's "pathlib everywhere", which was a convention with no check.
select = ["E", "F", "I", "UP", "B", "PTH"]
