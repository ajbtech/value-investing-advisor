[project]
name = "dossier"
version = "0.0.1"
description = "Reads SEC filings with LLM agents and produces cited value-investing dossiers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.11.12",
]

[project.scripts]
dossier = "dossier.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyyaml>=6.0",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dossier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not network'"
markers = [
    "network: test requires live network access to sec.gov (deselected by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
# The package, not the tests: the tests are checked by running them.
files = ["src/dossier"]
python_version = "3.11"
# Without this, mypy skips the body of any function lacking annotations, which is most
# of the CLI's helpers.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.ruff.lint]
# PTH enforces CLAUDE.md's "pathlib everywhere", which was a convention with no check.
select = ["E", "F", "I", "UP", "B", "PTH"]
